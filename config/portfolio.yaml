# ---------------------------------------------------------------------------
# 2. Systematic position rules
# ---------------------------------------------------------------------------
# The portfolio builder generates option legs by applying these rules to every
# underlying. 'quantity' is number of contracts (+ve = long, -ve = short).
# Moneyness = K/S_current at portfolio construction date.
#
# TODO: allow per-ticker overrides on top of these rules.

position_rules:
  # Long OTM puts — downside protection
  - option_type: put
    moneyness: 0.95
    tenor: "3m"
    quantity: 50

  - option_type: put
    moneyness: 0.85
    tenor: "6m"
    quantity: 25

  # Short OTM calls — yield enhancement / covered call overlay
  - option_type: call
    moneyness: 1.05
    tenor: "3m"
    quantity: -30

  # Long ATM straddles — selected underlyings only (applied to Technology and Energy)
  # TODO: implement sector-scoped position rules
  - option_type: call
    moneyness: 1.00
    tenor: "1m"
    quantity: 20
    sectors: [Technology, Energy]   # rule applies to these sectors only

  - option_type: put
    moneyness: 1.00
    tenor: "1m"
    quantity: 20
    sectors: [Technology, Energy]

  # Long 12m calls — long-dated upside exposure
  - option_type: call
    moneyness: 1.05
    tenor: "12m"
    quantity: 15

# ---------------------------------------------------------------------------
# 3. Index overlay
# ---------------------------------------------------------------------------
# A synthetic equal-weighted broad-market index is constructed from the 25
# underlyings. The overlay adds tail-hedge long calls on this index.

index_overlay:
  enabled: true
  index_name: "SYNTH_INDEX"
  weights: equal                 # equal-weighted across all 25 underlyings
  positions:
    - option_type: call
      moneyness: 1.05
      tenor: "3m"
      quantity: 100
    - option_type: call
      moneyness: 1.05
      tenor: "6m"
      quantity: 100
