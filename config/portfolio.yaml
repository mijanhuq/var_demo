# Portfolio configuration — 25 single-name equity underlyings
#
# Underlyings are synthetic names mapped to realistic sector characteristics.
# Actual option positions are generated programmatically by portfolio/portfolio.py
# using the position_rules below.
#
# TODO (Phase 1 hardening): support explicit per-leg position overrides here
#       so a desk can specify exact strikes/maturities/quantities for each option.

# ---------------------------------------------------------------------------
# 1. Underlyings
# ---------------------------------------------------------------------------
# Format: name, sector, S0 (initial price hint — overridden by generator),
#         notional_per_contract (USD), max_contracts_per_leg
#
# The generator samples S0 from sector-specific ranges; these values are
# informational only and used by the portfolio builder for contract sizing.

underlyings:
